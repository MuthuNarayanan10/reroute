# Render Blueprint: one click creates everything ReRoute needs.
#   Render dashboard → New → Blueprint → pick this GitHub repo → Apply.
# Full walkthrough: DEPLOY.md
#
# Resources (all in Singapore, closest Render region to India):
#   reroute-web     API + marketing website + seller dashboard (Docker)
#   reroute-worker  background jobs: webhooks, COD scoring, ReRoute offers (same Docker image)
#   reroute-db      PostgreSQL
#   reroute-redis   Redis-compatible Key Value store for job queues (must be noeviction)
# Secrets shared by web + worker live in the env group "reroute-secrets".

envVarGroups:
  - name: reroute-secrets
    envVars:
      - key: NODE_ENV
        value: production
      - key: ENCRYPTION_KEY          # encrypts Shopify tokens at rest. NEVER change after go-live.
        generateValue: true
      - key: ADMIN_API_KEYS          # internal ops API key (x-api-key)
        generateValue: true
      - key: COURIER_WEBHOOK_SECRET  # paste this same value into Shiprocket's webhook "token"
        generateValue: true
      # Integration keys are added in the dashboard after the first deploy (DEPLOY.md step 7–10):
      # SHOPIFY_API_KEY, SHOPIFY_API_SECRET, RAZORPAY_KEY_ID, RAZORPAY_KEY_SECRET, RAZORPAY_WEBHOOK_SECRET,
      # WHATSAPP_TOKEN, WHATSAPP_PHONE_NUMBER_ID, SHIPROCKET_EMAIL, SHIPROCKET_PASSWORD

services:
  - type: web
    name: reroute-web
    runtime: docker
    region: singapore
    plan: 0.5c-512mb
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    preDeployCommand: node dist/db/migrate.js   # applies database migrations before each release
    autoDeploy: true
    envVars:
      - fromGroup: reroute-secrets
      # Your public address. Once you add a custom domain, replace with:  - key: APP_URL / value: https://yourdomain.in
      - key: APP_URL
        fromService:
          name: reroute-web
          type: web
          envVarKey: RENDER_EXTERNAL_HOSTNAME
      - key: DATABASE_URL
        fromDatabase:
          name: reroute-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: reroute-redis
          property: connectionString

  - type: worker
    name: reroute-worker
    runtime: docker
    region: singapore
    plan: 0.5c-512mb
    dockerfilePath: ./Dockerfile
    dockerCommand: node dist/workers/index.js
    autoDeploy: true
    envVars:
      - fromGroup: reroute-secrets
      - key: APP_URL                 # keep identical to reroute-web's APP_URL
        fromService:
          name: reroute-web
          type: web
          envVarKey: RENDER_EXTERNAL_HOSTNAME
      - key: DATABASE_URL
        fromDatabase:
          name: reroute-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: reroute-redis
          property: connectionString

  - type: keyvalue
    name: reroute-redis
    region: singapore
    plan: 256mb
    maxmemoryPolicy: noeviction      # required by BullMQ: queued jobs must never be evicted
    ipAllowList: []                  # private network only

databases:
  - name: reroute-db
    region: singapore
    plan: 0.1c-256mb
    postgresMajorVersion: '16'
    databaseName: reroute
    user: reroute
    ipAllowList: []                  # private only; add your IP in the dashboard to load pincodes from your laptop
